<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oakville Election 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oakville Votes">
<meta name="theme-color" content="#094E8F">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Results analysis app: sticky header with tabs; Ward 7 deep dive first, then town-wide 360, every race, sources. */
:root{
  --silk:#F2F3F5; --card:#FFFFFF; --ink:#0B3D6E; --muted:#5A6B80; --line:#D9DEE5;
  --blue:#094E8F; --orange:#DC9040; --orange-text:#A8621A;
  --good:#1F7A4A; --warn:#B26A00; --track:#E4E8EE;
  --display:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --silk:#0C1622; --card:#13202F; --ink:#E6EDF5; --muted:#93A4B8; --line:#24374C;
  --blue:#3E86CF; --orange:#F0A957; --orange-text:#F0A957;
  --good:#4CC27F; --warn:#F0B44C; --track:#1E3045; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--silk);color:var(--ink);font:15px/1.45 var(--display);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:#094E8F;color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-stretch:125%;font-size:17px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.brand span{color:#F0A957}
.sub{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.9;margin-top:3px}
.turn{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.turn b{font-size:17px;color:#F0A957}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;color:#fff;opacity:.7;font:600 14px var(--display);padding:10px 12px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{opacity:1;border-color:#F0A957}
main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:26px}
h2{font-weight:800;font-stretch:112%;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.sect{display:flex;flex-direction:column;gap:12px}
.lede{margin:0;font-weight:800;font-stretch:112%;font-size:20px;line-height:1.22;text-wrap:balance}
.banner{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:6px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.banner b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box.ours{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rname{font-weight:700}
.chip{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.win{border-color:var(--good);color:var(--good)}
.chip.open{border-color:var(--blue);color:var(--blue)}
.chip.lost{border-color:var(--warn);color:var(--warn)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:14px}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.ours{color:var(--orange-text);font-weight:700}
.nm.won{font-weight:700}
.v{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.bar{grid-column:1/-1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar i.ours{background:var(--orange)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:8px}
.metrics div{display:flex;flex-direction:column;gap:1px;min-width:0}
.metrics b{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.metrics span{font-size:10.5px;color:var(--muted);line-height:1.2}
@media (max-width:420px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prior{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.stat b{font-weight:800;font-stretch:112%;font-size:22px;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.facts{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
tr.ours td{color:var(--orange-text);font-weight:700}
tr:last-child td{border-bottom:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:0}
.item a{color:var(--ink);font-weight:600;text-decoration:none}
.note{font-size:12.5px;color:var(--muted);margin:0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}
a{color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:7px 12px;font:600 13px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
h2.yr{margin-top:6px}
.calist{display:flex;flex-direction:column;gap:8px}
.cal{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.cal.you{border-color:var(--orange);box-shadow:inset 3px 0 0 var(--orange)}
.cal.now{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.cdate{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.25;padding-top:2px}
.cdate b{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:15px;color:var(--ink)}
.cbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.when2{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip.you{border-color:var(--orange);color:var(--orange-text)}
.src{font-size:12px;color:var(--blue);text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="brand">Oakville <span>Election 2026</span></div>
        <div class="sub" id="status">Loading results</div>
      </div>
      <div class="turn" id="turn"></div>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="ward7" aria-selected="true">Ward 7</button>
      <button role="tab" data-tab="town" aria-selected="false">Oakville 360</button>
      <button role="tab" data-tab="races" aria-selected="false">All races</button>
      <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
      <button role="tab" data-tab="sources" aria-selected="false">Sources</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"><div class="empty">Loading results…</div></div></main>

<script>
let CFG={races:[]},RES={races:{}},ANA=null,BASE={races:{}},BY={},CAL=null,calFilter="All";
const TABS=["ward7","town","races","calendar","sources"];
let tab=TABS.includes(location.hash.slice(1))?location.hash.slice(1):"ward7";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("en-CA");
const pct=(a,b,d=1)=>b?(a/b*100).toFixed(d)+"%":"–";
async function getJSON(p){const r=await fetch(p+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}

/* ---- per-race metrics ---- */
function M(id){
  const race=BY[id],r=RES.races?.[id];if(!race||!r)return null;
  const rows=race.c.map(n=>({n,v:Number(r.totals?.[n])||0})).sort((a,b)=>b.v-a.v);
  const sum=rows.reduce((a,b)=>a+b.v,0);
  const enc=sum?1/rows.reduce((a,x)=>a+(x.v/sum)**2,0):0;
  const ballots=r.ballots||sum;
  return {race,r,rows,sum,enc,ballots,blank:Math.max(0,ballots-sum),win:rows[0],second:rows[1],margin:rows[0].v-(rows[1]?.v||0)};
}
function seatChip(id){
  const b=BASE.races?.[id];if(!b)return"";
  const s=b.seat||"";const cls=/defeated/i.test(s)?"lost":/open/i.test(s)?"open":"win";
  return `<span class="chip ${cls}">${esc(s)}</span>`;
}
function priorLine(id){
  const b=BASE.races?.[id];if(!b)return"";const m=M(id);
  const p=b.r2022||[];const tot=p.reduce((a,x)=>a+x[1],0);
  let txt="";
  if(b.incumbent&&p.length){const was=p.find(x=>x[0]===b.incumbent);const now=m.rows.find(x=>x.n===b.incumbent);
    if(was&&now){const d=now.v/m.sum*100-was[1]/tot*100;txt=`${esc(b.incumbent)}: ${pct(was[1],tot)} in 2022, ${pct(now.v,m.sum)} now (${d>=0?"+":""}${d.toFixed(1)} pts). Votes cast in this race ${m.sum>tot?"up":"down"} ${Math.abs((m.sum/tot-1)*100).toFixed(0)}%.`}}
  else if(p.length){txt=`2022 winner: ${esc(p[0][0])} with ${pct(p[0][1],tot)}. Votes cast in this race ${m.sum>tot?"up":"down"} ${Math.abs((m.sum/tot-1)*100).toFixed(0)}% since 2022.`}
  if(b.note)txt+=(txt?" ":"")+esc(b.note);
  return txt?`<div class="prior">${txt}</div>`:"";
}
function raceBox(id){
  const m=M(id);if(!m)return"";
  const ours=m.race.c.includes(CFG.ours),top=Math.max(1,m.win.v);
  const rows=m.rows.map((x,i)=>`<div class="row"><span class="nm ${x.n===CFG.ours?"ours":""} ${i===0?"won":""}">${i===0?"✓ ":""}${esc(x.n)}</span><span class="v">${fmt(x.v)} · ${pct(x.v,m.sum)}</span><div class="bar"><i class="${x.n===CFG.ours?"ours":""}" style="width:${(x.v/top*100).toFixed(1)}%"></i></div></div>`).join("");
  return `<div class="box ${ours?"ours":""}"><div class="rhead"><span class="rname">${esc(m.race.name)}</span>${seatChip(id)}</div>${rows}
  <div class="metrics"><div><b>${pct(m.win.v,m.sum)}</b><span>winning share</span></div><div><b>${fmt(m.margin)}</b><span>margin (${(m.margin/m.sum*100).toFixed(1)} pts)</span></div><div><b>${m.enc.toFixed(1)}</b><span>effective candidates</span></div><div><b>${pct(m.blank,m.ballots)}</b><span>ballots skipped race</span></div></div>
  ${priorLine(id)}</div>`;
}
function marginsTable(){
  const ids=CFG.races.map(r=>r.id).filter(id=>M(id));
  const rows=ids.map(id=>({id,m:M(id)})).sort((a,b)=>a.m.margin/a.m.sum-b.m.margin/b.m.sum);
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Race</th><th>Winner</th><th class="n">Share</th><th class="n">Margin</th><th class="n">Pts</th><th class="n">Eff. cand.</th></tr></thead><tbody>
  ${rows.map((x,i)=>`<tr class="${x.m.race.c.includes(CFG.ours)?"ours":""}"><td class="n">${i+1}</td><td>${esc(x.m.race.name)}</td><td>${esc(x.m.win.n)}</td><td class="n">${pct(x.m.win.v,x.m.sum)}</td><td class="n">${fmt(x.m.margin)}</td><td class="n">${(x.m.margin/x.m.sum*100).toFixed(1)}</td><td class="n">${x.m.enc.toFixed(1)}</td></tr>`).join("")}
  </tbody></table></div><p class="note">Sorted from closest to least close. Acclaimed seats are not included.</p>`;
}
function wardBars(){
  const w=RES.stats?.wards;if(!w)return"";
  const rows=Object.entries(w),top=Math.max(...rows.map(x=>x[1])),avg=rows.reduce((a,b)=>a+b[1],0)/rows.length;
  return `<div class="box"><div class="rhead"><span class="rname">Ballots cast by ward</span><span class="chip">average ${fmt(Math.round(avg))}</span></div>
  ${rows.map(([n,v])=>`<div class="row"><span class="nm ${n==="Ward 7"?"ours":""}">${esc(n)}</span><span class="v">${fmt(v)} · ${pct(v,RES.stats.ballots)}</span><div class="bar"><i class="${n==="Ward 7"?"ours":""}" style="width:${(v/top*100).toFixed(1)}%"></i></div></div>`).join("")}</div>`;
}
function section(s){
  return `<section class="sect"><h2>${esc(s.title)}</h2>
  ${s.headline?`<p class="lede">${esc(s.headline)}</p>`:""}
  ${s.cards?`<div class="stats">${s.cards.map(c=>`<div class="stat"><b>${esc(c.v)}</b><span>${esc(c.l)}</span></div>`).join("")}</div>`:""}
  ${s.race?`<div class="grid">${raceBox(s.race)}</div>`:""}
  ${s.id==="turnout"||s.id==="w7-participation"?wardBars():""}
  ${s.table==="margins"?marginsTable():""}
  ${s.points?`<div class="box"><div class="rname">What it means</div><ul class="facts">${s.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
  </section>`;
}
/* ---- election calendar ---- */
const DAY=864e5;
function todayToronto(){const s=new Date().toLocaleDateString("en-CA",{timeZone:"America/Toronto"});return new Date(s+"T00:00:00")}
function dParts(iso){const d=new Date(iso+"T00:00:00");return{d,wd:d.toLocaleDateString("en-CA",{weekday:"short"}),md:d.toLocaleDateString("en-CA",{month:"short",day:"numeric"}),y:d.getFullYear()}}
function untilText(days){if(days===0)return"Today";if(days===1)return"Tomorrow";if(days<0)return`${-days} days ago`;if(days<60)return`in ${days} days`;const m=Math.round(days/30.44);return m<24?`in ${m} months`:`in ${(days/365.25).toFixed(1)} years`}
const CAL_FILTERS=[["All",()=>true],["Oakville voters",x=>x.you],["Federal",x=>x.level==="Federal"],["Provincial & territorial",x=>x.level==="Provincial"||x.level==="Territorial"],["Municipal",x=>x.level==="Municipal"],["By-elections",x=>x.level==="By-election"]];
function calItem(x,t){
  const p=dParts(x.date),days=Math.round((p.d-t)/DAY),src=CAL.sources[x.src];
  const kindCls=x.kind==="Fixed date"?"win":x.kind==="Held"?"":/No fixed|Expected/.test(x.kind)?"lost":"open";
  return `<div class="cal ${x.you?"you":""} ${days===0?"now":""}">
   <div class="cdate"><span>${x.dateText?"":esc(p.wd)}</span><b>${esc(x.dateText||p.md)}</b><span>${x.dateText?"":p.y}</span></div>
   <div class="cbody"><div class="rhead"><span class="rname">${esc(x.title)}</span><span class="when2">${x.kind==="Held"?"Held":untilText(days)}</span></div>
    <div class="chips"><span class="chip">${esc(x.level)}</span><span class="chip">${esc(x.where)}</span><span class="chip ${kindCls}">${esc(x.kind)}</span>${x.you?`<span class="chip you">Oakville votes</span>`:""}</div>
    ${x.note?`<p class="note">${esc(x.note)}</p>`:""}
    ${src?`<a class="src" href="${esc(src.u)}" target="_blank" rel="noopener">${esc(src.t)}</a>`:""}</div></div>`;
}
function calendarView(){
  if(!CAL)return`<div class="empty">Loading the election calendar…</div>`;
  const t=todayToronto(),f=CAL_FILTERS.find(x=>x[0]===calFilter)[1];
  const all=[...CAL.items].sort((a,b)=>a.date.localeCompare(b.date));
  const up=all.filter(x=>x.kind!=="Held"&&new Date(x.date+"T00:00:00")>=t&&f(x));
  const recent=all.filter(x=>(x.kind==="Held"||new Date(x.date+"T00:00:00")<t)&&(t-new Date(x.date+"T00:00:00"))/DAY<=75&&f(x)).reverse();
  const next=all.find(x=>x.kind!=="Held"&&x.you&&new Date(x.date+"T00:00:00")>=t);
  const years=[...new Set(up.map(x=>x.date.slice(0,4)))];
  const nextBox=next?`<div class="stats"><div class="stat"><b>${esc(next.dateText||dParts(next.date).md+", "+dParts(next.date).y)}</b><span>Next election Oakville residents vote in: ${esc(next.title)} (${untilText(Math.round((new Date(next.date+"T00:00:00")-t)/DAY))})</span></div><div class="stat"><b>${all.filter(x=>x.kind!=="Held"&&new Date(x.date+"T00:00:00")>=t).length}</b><span>upcoming elections and by-election deadlines across Canada</span></div></div>`:"";
  return `<section class="sect"><h2>Election calendar</h2><p class="lede">Every upcoming election in Canada, from federal to municipal</p>${nextBox}
   <div class="seg">${CAL_FILTERS.map(([n])=>`<button data-cf="${esc(n)}" aria-pressed="${n===calFilter}">${esc(n)}</button>`).join("")}</div>
   ${years.length?years.map(y=>`<h2 class="yr">${y}</h2><div class="calist">${up.filter(x=>x.date.startsWith(y)).map(x=>calItem(x,t)).join("")}</div>`).join(""):`<div class="empty">No upcoming items in this view.</div>`}
   ${recent.length?`<h2 class="yr">Recently held</h2><div class="calist">${recent.map(x=>calItem(x,t)).join("")}</div>`:""}
   <p class="note">${esc(CAL.note)} Last checked ${esc(CAL.updated)}.</p></section>`;
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const v=$("#view");
  if(!CFG.races.length||!ANA){v.innerHTML=`<div class="empty">Loading results…</div>`;return}
  const banner=`<div class="banner"><b>Results are in.</b> ${esc(ANA.status)}</div>`;
  if(tab==="ward7") v.innerHTML=banner+ANA.ward7.map(section).join("");
  else if(tab==="town") v.innerHTML=banner+ANA.overview.map(section).join("");
  else if(tab==="calendar") v.innerHTML=calendarView();
  else if(tab==="races"){
    const groups=[...new Set(CFG.races.map(r=>r.group))];
    v.innerHTML=`<p class="note"><b>Effective candidates</b> shows how divided a race was: 1.0 means one candidate took every vote, and 3.0 means a vote split evenly three ways. <b>Ballots skipped race</b> counts ballots that left this race blank.</p>`+
      groups.map(g=>`<section class="sect"><h2>${esc(g)}</h2><div class="grid">${CFG.races.filter(r=>r.group===g).map(r=>raceBox(r.id)).join("")}</div></section>`).join("")+
      `<section class="sect"><h2>Acclaimed (no vote held)</h2><div class="box"><ul class="facts">${(CFG.acclaimed||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div></section>`;
  } else {
    v.innerHTML=`<section class="sect"><h2>Sources</h2><div class="list">${ANA.sources.map(x=>`<div class="item"><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a></div>`).join("")}</div>
    <p class="note">Results update automatically every 6 hours from the Town's data file until the Clerk declares the official results. 2026 figures are unofficial. Ward 7 turnout is estimated from the size of the ward's voters' list.</p></section>`;
  }
}
async function load(){
  try{
    const [c,r,a,b]=await Promise.all([getJSON("data/races.json"),getJSON("data/results.json"),getJSON("data/analysis.json"),getJSON("data/baseline2022.json").catch(()=>({races:{}}))]);
    CFG=c;RES=r;ANA=a;BASE=b;BY=Object.fromEntries(CFG.races.map(x=>[x.id,x]));
    CAL=await getJSON("data/calendar.json").catch(()=>null);
    const s=RES.stats;
    if(s){$("#turn").innerHTML=`<b>${s.turnout}%</b><br>turnout · ${fmt(s.ballots)} ballots`;
      $("#status").textContent=`${s.closedTabulators} of ${s.tabulators} tabulators · unofficial`;}
  }catch(e){$("#status").textContent="Could not load results. Pull to refresh."}
  render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;history.replaceState(null,"","#"+tab);render();scrollTo(0,0);return}
  const c=e.target.closest("[data-cf]");if(c){calFilter=c.dataset.cf;render()}
});
load();
</script>

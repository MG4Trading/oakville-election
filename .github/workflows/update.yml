name: Update results

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, to pick up the Town's official declaration
  workflow_dispatch:         # "Run workflow" button in the GitHub app or website
  push:
    branches: [main]
    paths: ["scripts/**", "data/races.json", "data/manual.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the Town of Oakville results file
        run: node scripts/update.mjs
      - name: Commit changes
        run: |
          git config user.name "election-bot"
          git config user.email "election-bot@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

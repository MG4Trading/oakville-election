name: Capture official results
on:
  push:
    branches: [main]
    paths: [".github/workflows/capture.yml", "scripts/capture.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/capture.mjs
      - name: Commit capture
        run: |
          git config user.name "election-bot"
          git config user.email "election-bot@users.noreply.github.com"
          git add capture
          git commit -m "Capture official results pages" || exit 0
          git pull --rebase origin main
          git push
